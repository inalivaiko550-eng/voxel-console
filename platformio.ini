[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Настройки для дисплея (если используешь TFT_eSPI)
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=15
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=27000000

lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
