name: Build Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          
      - name: Build Firmware
        run: pio run -e esp32dev
        
      - name: Prepare Files for Upload
        run: |
          mkdir -p output_files
          cp .pio/build/esp32dev/firmware.bin output_files/
          cp .pio/build/esp32dev/bootloader.bin output_files/
          cp .pio/build/esp32dev/partitions.bin output_files/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware_all
          path: output_files/
